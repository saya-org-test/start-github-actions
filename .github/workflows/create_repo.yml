name: create_repo
# inputs 값을 사용자로 부터 받아야 하므로,
# workflow_dispatch를 사용한다.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'repo name'
        required: true
        default: 'service'
        type: choice
        options:
          - example
          - service
      
      name:
        description: 'set repo name'
        required: true
        default: 'github-actions'
        type: string
        
jobs:
  create-repo:
    runs-on: ubuntu-latest
    steps:
      - name: gh auth login
        run: |
          echo ${{ secrets.PERSONAL_ACCESS_TOKEN}} | gh auth login --with-token
          unset GITHUB_TOKEN
      - name: create repo
        # id를 활용하여 outputs을 구성할 것 -> 결과 값을 확인하여 slack으로 보낼것 -> outputs 사용하기 위해 id가 필요함
        id: create-repo
        run: |
          gh repo create saya-org-test/${{ inputs.prefix }}-${{ inputs.name }} --public --add-readme
      
      - name: slack notification
        # aways() 를 step 레벨에 사용하여, 앞에 스텝이 실패 하더라도 해당 step은 항상 실행 된다
        if: always()
        # uses 키워드 : actios를 import 및 사용
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          #method: 'chat.postMessage'
          # ${{ steps.create-repo.outcome }}" 성공: success, 실패: failure
          # ${{ steps.create-repo.outcome }}": 결과 값을 가져옴
          payload: |
            {
              "attachments": [
                {
                  "pretext": "create repo result",
                  "color": "28a745",
                  "fields": [
                    {
                      "title": "create repo result: ${{ steps.create-repo.outcome }}",
                      "short": true,
                      "value": "${{ inputs.prefix }}-${{ inputs.name }}"
                    }
                  ]
                }
              ]
            }
          
     
        
        
  
  
