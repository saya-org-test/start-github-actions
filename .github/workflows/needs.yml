name: needs
# push 될때
on: push

jobs:
  # 총 4개의 job -> 기본적으로 병렬로 실행 된다
  # needs: 키워드를 통해 종속성을 가질수있다
  # needs: 에 선언된 job은 다른 job이 성공적으로 종료된 이후 실행된다.
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "job1 done"
  
  job2:
    runs-on: ubuntu-latest
    needs: [job1]
    # job1 이라는 작업이 성공될 경우 실행 된다.
    steps:
      - name: echo
        run: |
          echo "this job is running after job1"
          echo "job2 done"
          
  job3:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: |
          echo "this job have to fail"
          echo "exit 1 is commands to fail"
          exit 1
  job4:
    runs-on: ubuntu-latest
    needs: [job3]
    # job3 이라는 작업이 성공될 경우 실행 된다.
    steps:
      - name: echo
        run: |
          echo "this job have to skip"
          echo "because job3 failed"
